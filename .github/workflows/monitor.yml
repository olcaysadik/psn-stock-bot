name: PSN Amazon Stock Monitor

on:
  push:
    branches: [main]
    paths: ['monitor.py', 'requirements*.txt', 'tests/**', '.github/workflows/monitor.yml']
  pull_request:
    paths: ['monitor.py', 'requirements*.txt', 'tests/**', '.github/workflows/monitor.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Diagnose Amazon, test Gmail, or monitor verified stock
        required: true
        default: diagnose
        type: choice
        options: [diagnose, test, monitor]
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: psn-stock-monitor
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'schedule' || vars.BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Python syntax, unit tests, workflow validation
        run: |
          python -m py_compile monitor.py
          python -m unittest discover -s tests -v

  watch:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'schedule' || vars.BOT_ENABLED == 'true')
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CHECK_MODE: ${{ github.event_name == 'schedule' && 'monitor' || github.event_name == 'workflow_dispatch' && inputs.mode || 'diagnose' }}
      BOT_ENABLED: ${{ vars.BOT_ENABLED }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Chromium installation
        if: env.CHECK_MODE != 'test'
        run: python -m playwright install --with-deps chromium
      - name: Offline rendered-page tests
        if: env.CHECK_MODE != 'test'
        env:
          RUN_BROWSER_TESTS: 'true'
        run: python -m unittest discover -s tests -p test_dom.py -v
      - name: Run selected mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: python monitor.py --mode "$CHECK_MODE"
      - name: Upload safe diagnostics (including failed checks)
        if: always() && env.CHECK_MODE != 'test'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: amazon-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 3
